<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Node.js</title>
</head>
<body>
    <h1>Moje dane z serwera:</h1>
    <div id="dane">Ładowanie danych...</div>

    <script>
        fetch('/api/hello')
            .then(response => response.json())
            .then(data => {
                // Виводимо отримані дані на сторінку
                const div = document.getElementById('dane');
                div.innerHTML = `
                    <p>Imię: <strong>${data.imie}</strong></p>
                    <p>Nazwisko: <strong>${data.nazwisko}</strong></p>
                    <p>Numer indeksu: <strong>${data.indeks}</strong></p>
                `;
            })
            .catch(error => {
                console.error('Błąd:', error);
                document.getElementById('dane').innerText = "Wystąpił błąd podczas pobierania danych.";
            });
    </script>
</body>
</html>
